<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI新闻简报</title>
    
    <!-- SEO Meta Tags -->
    <meta name="description" content="每日AI新闻简报，汇集AIBase、机器之心、新智元、Google AI Blog等来源的AI行业资讯，以及GitHub trending项目推荐。">
    <meta name="keywords" content="AI新闻,人工智能,机器学习,GitHub趋势,AI简报,AIBase,机器之心,新智元,Google AI">
    <meta name="author" content="AI News Bot">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://ai-news.vercel.app/">
    
    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="AI新闻简报 - 每日AI行业资讯">
    <meta property="og:description" content="每日AI新闻简报，汇集AIBase、机器之心、新智元、Google AI Blog等来源的AI行业资讯。">
    <meta property="og:url" content="https://ai-news.vercel.app/">
    <meta property="og:site_name" content="AI新闻简报">
    <meta property="og:locale" content="zh_CN">
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="AI新闻简报 - 每日AI行业资讯">
    <meta name="twitter:description" content="每日AI新闻简报，汇集AIBase、机器之心、新智元、Google AI Blog等来源的AI行业资讯。">
    
    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤖</text></svg>">
    
    <style>
        :root {
            --bg-primary: #fafafa;
            --bg-secondary: #ffffff;
            --text-primary: #1a1a1a;
            --text-secondary: #666666;
            --accent-color: #0070f3;
            --border-color: #e1e4e8;
            --shadow: rgba(0, 0, 0, 0.1);
            --github-bg: #f6f8fa;
        }
        
        [data-theme="dark"] {
            --bg-primary: #0d1117;
            --bg-secondary: #161b22;
            --text-primary: #c9d1d9;
            --text-secondary: #8b949e;
            --accent-color: #58a6ff;
            --border-color: #30363d;
            --shadow: rgba(0, 0, 0, 0.3);
            --github-bg: #21262d;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            line-height: 1.6;
            background: var(--bg-primary);
            color: var(--text-primary);
            transition: background 0.3s, color 0.3s;
        }
        
        h1 {
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 10px;
            color: var(--text-primary);
            font-size: 1.5em;
        }
        
        h2 {
            color: var(--text-primary);
            margin-top: 30px;
            padding: 10px;
            background: var(--bg-secondary);
            border-left: 4px solid var(--accent-color);
            font-size: 1.2em;
            border-radius: 4px;
        }
        
        .nav {
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }
        
        .nav a {
            color: var(--accent-color);
            text-decoration: none;
            font-size: 16px;
        }
        
        .nav a:hover { text-decoration: underline; }
        
        .theme-toggle {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            margin-left: auto;
        }
        
        .theme-toggle:hover { background: var(--border-color); }
        
        .archive-list {
            background: var(--bg-secondary);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 1px 3px var(--shadow);
        }
        
        .archive-item {
            padding: 12px 0;
            border-bottom: 1px solid var(--border-color);
        }
        
        .archive-item:last-child { border-bottom: none; }
        
        .archive-item a {
            color: var(--accent-color);
            text-decoration: none;
            font-weight: 500;
            display: block;
            padding: 8px 0;
        }
        
        .archive-item a:hover {
            text-decoration: underline;
            transform: translateX(4px);
            transition: transform 0.2s;
        }
        
        .empty { color: var(--text-secondary); font-style: italic; }
        
        .footer {
            margin-top: 40px;
            padding: 20px;
            background: var(--bg-secondary);
            border-radius: 8px;
            color: var(--text-secondary);
            font-size: 0.85em;
            box-shadow: 0 1px 3px var(--shadow);
        }
        
        .footer a { color: var(--accent-color); }
        
        .source-tag { color: var(--text-secondary); font-size: 0.9em; font-weight: 500; }
        
        ul {
            list-style-type: none;
            padding: 0;
            background: var(--bg-secondary);
            border-radius: 8px;
            box-shadow: 0 1px 3px var(--shadow);
        }
        
        li {
            padding: 15px;
            border-bottom: 1px solid var(--border-color);
        }
        
        li:last-child { border-bottom: none; }
        
        .github-item {
            background: var(--github-bg);
            padding: 15px;
            border-radius: 6px;
            margin: 10px 0;
            border: 1px solid var(--border-color);
        }
        
        .github-item strong { color: var(--accent-color); }
        
        .stars { color: #f97316; font-weight: 500; }
        
        .back-link { margin-top: 20px; }
        
        .back-link a {
            color: var(--accent-color);
            text-decoration: none;
            display: inline-block;
            padding: 8px 0;
        }
        
        /* Responsive */
        @media (max-width: 600px) {
            body { padding: 15px; }
            
            h1 { font-size: 1.3em; }
            
            h2 { font-size: 1.1em; }
            
            .nav { gap: 10px; }
            
            .theme-toggle { margin-left: 0; }
            
            .archive-list, .footer, ul { padding: 15px; }
            
            li, .github-item { padding: 12px; }
        }
        
        @media (max-width: 400px) {
            body { padding: 10px; }
            
            .nav a, .theme-toggle { font-size: 14px; }
        }
    </style>
</head>
<body>
    <div class="nav">
        <a href="index.html">首页</a>
        <a href="archive.html">历史存档</a>
        <button class="theme-toggle" onclick="toggleTheme()" aria-label="切换主题">🌙 暗色模式</button>
    </div>
    
    <h1>📁 历史存档</h1>
    <div class="archive-list" id="post-list">
        <p class="empty">暂无历史存档...</p>
    </div>
    
    <div class="footer">
        <p>AI新闻来源：<a href="https://www.aibase.com/" target="_blank" rel="noopener">AIBase</a>、<a href="https://jiqizhixin.com/" target="_blank" rel="noopener">机器之心</a>、<a href="https://ai.ua.edu.cn/" target="_blank" rel="noopener">新智元</a>、<a href="https://blog.google/technology/ai/" target="_blank" rel="noopener">Google AI Blog</a></p>
        <p>GitHub数据来源：<a href="https://github.com/trending" target="_blank" rel="noopener">github.com/trending</a></p>
    </div>

    <script>
    // Theme toggle
    function toggleTheme() {
        const html = document.documentElement;
        const btn = document.querySelector('.theme-toggle');
        if (html.getAttribute('data-theme') === 'dark') {
            html.removeAttribute('data-theme');
            btn.textContent = '🌙 暗色模式';
            localStorage.setItem('theme', 'light');
        } else {
            html.setAttribute('data-theme', 'dark');
            btn.textContent = '☀️ 亮色模式';
            localStorage.setItem('theme', 'dark');
        }
    }
    
    // Load saved theme or system preference
    (function() {
        const saved = localStorage.getItem('theme');
        if (saved === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
            document.querySelector('.theme-toggle').textContent = '☀️ 亮色模式';
        } else if (saved === 'light') {
            document.documentElement.removeAttribute('data-theme');
            document.querySelector('.theme-toggle').textContent = '🌙 暗色模式';
        } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.setAttribute('data-theme', 'dark');
            document.querySelector('.theme-toggle').textContent = '☀️ 亮色模式';
        }
    })();
    
    // Auto list posts
    async function loadArchive() {
        const list = document.getElementById('post-list');
        try {
            const response = await fetch('posts/');
            const text = await response.text();
            const parser = new DOMParser();
            const doc = parser.parseFromString(text, 'text/html');
            const links = doc.querySelectorAll('a');
            const posts = [];
            links.forEach(link => {
                const href = link.getAttribute('href');
                if (href && href.match(/^\d{4}-\d{2}-\d{2}\.html$/)) {
                    const date = href.replace('.html', '');
                    const label = date;
                    posts.push({ date, label, href: 'posts/' + href });
                }
            });
            posts.sort((a, b) => b.date.localeCompare(a.date));
            if (posts.length > 0) {
                list.innerHTML = posts.map(p => 
                    `<div class="archive-item"><a href="${p.href}">📰 ${p.label}</a></div>`
                ).join('');
            }
        } catch (e) {
            list.innerHTML = '<p class="empty">无法加载存档列表</p>';
        }
    }
    loadArchive();
    </script>
</body>
</html>
